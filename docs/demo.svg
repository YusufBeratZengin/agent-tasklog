<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">agent-tasklog: resume work, list tasks, and total receipts</title>
  <desc id="desc">Real CLI output from the synthetic example log. The waiting parser task retains its next action and checkpoint; receipts total exactly 0.3 credits.</desc>
  <rect x="1" y="1" width="958" height="488" rx="16" fill="#0d1117" stroke="#30363d"/>
  <path d="M17 1h926a16 16 0 0 1 16 16v35H1V17A16 16 0 0 1 17 1Z" fill="#161b22"/>
  <circle cx="27" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="49" cy="27" r="6" fill="#febc2e"/>
  <circle cx="71" cy="27" r="6" fill="#28c840"/>
  <text x="480" y="32" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">agent-tasklog / examples</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" xml:space="preserve">
    <text x="30" y="91" fill="#7ee787">$ tasklog resume</text>
    <text x="30" y="117" fill="#e6edf3">t-c1375492 [waiting] Handle empty input</text>
    <text x="30" y="143" fill="#e6edf3">Area: parser</text>
    <text x="30" y="169" fill="#e6edf3">Due: 2026-10-23</text>
    <text x="30" y="195" fill="#e6edf3">Next: Run parser tests</text>
    <text x="30" y="221" fill="#e6edf3">Checkpoint (2026-10-22T09:30:00.000Z): Parser fixed; regression test pending</text>
    <text x="30" y="247" fill="#e6edf3"></text>
    <text x="30" y="273" fill="#7ee787">$ tasklog list --all</text>
    <text x="30" y="299" fill="#e6edf3">t-c1375492 [waiting] 2026-10-23 parser: Handle empty input</text>
    <text x="30" y="325" fill="#e6edf3">  Next: Run parser tests</text>
    <text x="30" y="351" fill="#e6edf3">t-20badff4 [done] 2026-10-24 docs: Review usage guide</text>
    <text x="30" y="377" fill="#e6edf3">  Next: Archive review</text>
    <text x="30" y="403" fill="#e6edf3"></text>
    <text x="30" y="429" fill="#7ee787">$ tasklog cost total</text>
    <text x="30" y="455" fill="#e6edf3">local-runner: 0.3 credits</text>
  </g>
</svg>
