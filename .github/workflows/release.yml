name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Check tag matches package version
        shell: bash
        run: test "v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")" = "$GITHUB_REF_NAME"
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public
