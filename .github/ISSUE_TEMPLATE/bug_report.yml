name: Bug report
description: Report a reproducible problem with tasklog
labels: [bug]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues
          required: true
  - type: input
    id: version
    attributes:
      label: tasklog version
      description: Output of tasklog --version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of node --version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include minimal commands using synthetic data only
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove credentials, personal data and local paths before posting
      render: text
