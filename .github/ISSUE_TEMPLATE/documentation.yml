name: Documentation
description: Propose an improvement or correction to the documentation
labels: [documentation]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Existing documentation
      options:
        - label: I searched existing issues and verified the latest documentation
          required: true
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: File or section that needs improvement (e.g. README.md, README.tr.md, CONTRIBUTING.md, examples/)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Describe what is unclear, missing, or inaccurate, and your proposed improvement
    validations:
      required: true
